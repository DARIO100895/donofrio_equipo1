spring:
  application:
    name: transacciones

  #Config postgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/Logistica2
    username: postgres
    password: pos123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
  #Jpa
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
    open-in-view: false


  server:
    port: 8080
    servlet:
      context-path: /api/v1


