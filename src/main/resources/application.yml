server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: transacciones

  #Config postgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/CompraVentaBase
    username: postgres
    password: pos123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
  #Jpa
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
    open-in-view: false

jwt:
  secret: WV2JKMrE80aFXVuqMqaJDriFY+yXhZYqlMOpe+lc7U0=
  expiration: 86400000

logging:
  level:
    com.transacciones.auth: DEBUG
    org.springframework.security: DEBUG
